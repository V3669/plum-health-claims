<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Plum Claims{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #1a1a2e; }
    .nav { background: #6c3db5; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
    .nav a { color: white; text-decoration: none; font-weight: 500; }
    .nav .brand { font-size: 1.2rem; font-weight: 700; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 16px; color: #3d1c8a; }
    h2 { font-size: 1.2rem; margin-bottom: 12px; color: #3d1c8a; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px; color: #444; }
    input, select, textarea { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; font-size: 0.9rem; }
    input:focus, select:focus { outline: none; border-color: #6c3db5; }
    .btn { background: #6c3db5; color: white; border: none; border-radius: 6px; padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
    .btn:hover { background: #5a30a0; }
    .btn-sm { padding: 4px 12px; font-size: 0.8rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 14px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; }
    .badge-APPROVED { background: #d1fae5; color: #065f46; }
    .badge-PARTIAL { background: #fef3c7; color: #92400e; }
    .badge-REJECTED { background: #fee2e2; color: #991b1b; }
    .badge-MANUAL_REVIEW { background: #ede9fe; color: #5b21b6; }
    .badge-HALTED { background: #f3f4f6; color: #374151; }
    .badge-PASS { background: #d1fae5; color: #065f46; }
    .badge-FAIL { background: #fee2e2; color: #991b1b; }
    .badge-DEGRADED { background: #fef3c7; color: #92400e; }
    .badge-SKIPPED { background: #f3f4f6; color: #6b7280; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { background: #f9fafb; text-align: left; padding: 10px 12px; border-bottom: 2px solid #e5e7eb; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }
    .amount { font-weight: 700; color: #065f46; }
    .alert { padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
    .alert-error { background: #fee2e2; border-left: 4px solid #dc2626; color: #7f1d1d; }
    .alert-warning { background: #fffbeb; border-left: 4px solid #f59e0b; color: #78350f; }
    .alert-success { background: #ecfdf5; border-left: 4px solid #10b981; color: #065f46; }
    details summary { cursor: pointer; font-size: 0.85rem; color: #6c3db5; user-select: none; }
    details summary:hover { text-decoration: underline; }
    pre { background: #f8f8f8; border-radius: 6px; padding: 12px; font-size: 0.78rem; overflow-x: auto; }
    .trace-row { border-left: 4px solid transparent; padding: 12px; margin: 6px 0; border-radius: 6px; background: #fafafa; }
    .trace-PASS { border-color: #10b981; }
    .trace-FAIL { border-color: #ef4444; }
    .trace-DEGRADED { border-color: #f59e0b; }
    .trace-SKIPPED { border-color: #9ca3af; }
    .conf-bar { display: inline-block; width: 60px; height: 6px; background: #e5e7eb; border-radius: 3px; vertical-align: middle; margin-left: 6px; }
    .conf-fill { height: 100%; border-radius: 3px; background: #10b981; }
  </style>
</head>
<body>
<nav class="nav">
  <span class="brand">Plum Claims</span>
  <a href="/">Submit Claim</a>
  <a href="/claims">All Claims</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
